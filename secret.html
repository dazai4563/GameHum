<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Секретное меню</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #050508 !important;
        }
        .secret-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #aa66ff;
        }
        .moon-display {
            background: #111118;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 20px;
            color: #ffcc88;
        }
        .secret-game-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .secret-game-card {
            background: #111118;
            border-radius: 16px;
            padding: 20px;
            width: 200px;
            text-align: center;
            border: 1px solid #2a2a3a;
            transition: 0.2s;
        }
        .secret-game-card:hover {
            transform: translateY(-5px);
            background: #181824;
        }
        .secret-game-card h2 {
            color: #aaa;
        }
        .secret-game-card p {
            color: #666;
            font-size: 14px;
        }
        .secret-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 10px;
        }
        .secret-btn:hover {
            background: #3a3a4a;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
    </style>
</head>
<body>
<div class="secret-container">
    <h1>Секретное меню</h1>
    <div class="moon-display">
        🌙 Mp: <strong id="moonValue">0</strong>
    </div>
    <div class="secret-game-menu">
        <div class="secret-game-card">
            <h2>🎰 Слоты</h2>
            <p>Однорукий бандит на Mp</p>
            <a href="slots.html" class="secret-btn">Играть</a>
        </div>
        <div class="secret-game-card">
            <h2>🎡 Колесо удачи</h2>
            <p>Рискни лунами на рулетке</p>
            <a href="roulette.html" class="secret-btn">Играть</a>
        </div>
        <!-- Здесь позже можно добавить другие секретные игры -->
    </div>
    <a href="index.html" class="back-btn">↺ Вернуться в обычное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="moon.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof displayMp === 'function') await displayMp();
        window.addEventListener('mpUpdated', () => {
            if (typeof displayMp === 'function') displayMp();
        });
    });
</script>
</body>
</html>
