<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Секретное меню</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Темнее, чем основное меню */
        body {
            background: #050508 !important;
        }
        .secret-container {
            background: #0a0a10 !important;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #cc99ff !important;
        }
        .secret-user-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0f;
            padding: 8px 20px;
            border-radius: 40px;
            margin-bottom: 30px;
            color: #aaa;
        }
        .secret-user-status span {
            color: #ccc;
        }
        .secret-game-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .secret-game-card {
            background: #111118;
            border-radius: 16px;
            padding: 20px;
            width: 220px;
            text-align: center;
            transition: 0.2s;
            border: 1px solid #2a2a3a;
        }
        .secret-game-card:hover {
            transform: translateY(-5px);
            background: #181824;
        }
        .secret-game-card h2 {
            color: #bb99ff;
        }
        .secret-game-card p {
            color: #777;
        }
        .secret-btn {
            background: #2a2a3a;
            color: #ccc;
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .secret-btn:hover {
            background: #3a3a4a;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
        /* полумесяц вместо звезды */
        .moon-icon {
            display: inline-block;
            font-size: 1.2em;
            filter: drop-shadow(0 0 2px #b77cff);
        }
    </style>
</head>
<body>
<div class="secret-container">
    <h1>🥷 <span class="moon-icon">🌙</span> Секретное меню <span class="moon-icon">🌙</span></h1>
    <div class="secret-user-status">
        <span id="currentUserSecret"></span>
        <span><span class="moon-icon">🌙</span> XP: <span id="xpValueSecret">0</span></span>
        <button id="logoutBtnSecret" style="display: none;">Выйти</button>
        <a href="login.html?redirect=secret.html" id="loginLinkSecret">Войти</a>
    </div>
    <div class="secret-game-menu">
        <!-- Секретная игра: Рулетка -->
        <div class="secret-game-card">
            <h2>🎡 Колесо удачи</h2>
            <p>Рулетка на XP. Испытай удачу.</p>
            <a href="roulette.html" class="secret-btn">Играть</a>
        </div>
        <!-- Здесь можно добавить другие секретные игры -->
    </div>
    <a href="index.html" class="back-btn">↺ Вернуться в обычное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="xp.js"></script>
<script>
    // Перенастроим отображение XP и пользователя для секретного меню
    async function updateSecretUI() {
        const userSpan = document.getElementById('currentUserSecret');
        const xpSpan = document.getElementById('xpValueSecret');
        if (window.currentUser) {
            const name = window.currentUser.user_metadata?.username || 'Аноним';
            userSpan.textContent = `👤 ${name}`;
        } else {
            userSpan.textContent = '👤 Гость';
        }
        if (typeof getCurrentXP === 'function') {
            const xp = await getCurrentXP();
            xpSpan.textContent = xp;
        } else {
            xpSpan.textContent = localStorage.getItem('guest_xp') || 0;
        }
        const logoutBtn = document.getElementById('logoutBtnSecret');
        const loginLink = document.getElementById('loginLinkSecret');
        if (window.currentUser) {
            logoutBtn.style.display = 'inline-block';
            loginLink.style.display = 'none';
        } else {
            logoutBtn.style.display = 'none';
            loginLink.style.display = 'inline-block';
        }
    }
    document.addEventListener('DOMContentLoaded', () => {
        updateSecretUI();
        document.getElementById('logoutBtnSecret')?.addEventListener('click', async () => {
            await logout();
            updateSecretUI();
        });
    });
    // Обновляем XP при изменениях
    setInterval(updateSecretUI, 2000);
</script>
</body>
</html>
