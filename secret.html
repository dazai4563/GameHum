<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🥷 Секретное меню</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #050508 !important;
        }
        .secret-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #aa66ff;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111118;
            padding: 10px 20px;
            border-radius: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .mp-display {
            font-size: 1.2rem;
            color: #ffcc88;
        }
        .exchange-link {
            background: linear-gradient(135deg, #4a2a6a, #2a1a4a);
            padding: 6px 16px;
            border-radius: 40px;
            text-decoration: none;
            color: #ffcc88;
            font-weight: bold;
            transition: 0.2s;
        }
        .exchange-link:hover {
            background: linear-gradient(135deg, #6a4a9a, #4a2a6a);
            transform: scale(1.02);
        }
        .secret-game-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .secret-game-card {
            background: #111118;
            border-radius: 16px;
            padding: 20px;
            width: 200px;
            text-align: center;
            border: 1px solid #2a2a3a;
            transition: 0.2s;
        }
        .secret-game-card:hover {
            transform: translateY(-5px);
            background: #181824;
        }
        .secret-game-card h2 {
            color: #dd99ff;
        }
        .secret-game-card p {
            color: #aaa;
            font-size: 14px;
        }
        .secret-btn {
            background: #2a2a3a;
            color: #ffcc88;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 10px;
        }
        .secret-btn:hover {
            background: #3a3a4a;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
        @media (max-width: 600px) {
            .top-bar {
                flex-direction: column;
            }
            .secret-game-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="secret-container">
    <h1>🥷 Секретное меню</h1>
    <div class="top-bar">
        <div class="mp-display">
            🌙 Mp: <strong id="mpValue">0</strong>
        </div>
        <a href="exchange.html" class="exchange-link">🏦 Обменник (Mp ↔ XP)</a>
    </div>
    <div class="secret-game-menu">
        <div class="secret-game-card">
            <h2>🎡 Колесо удачи</h2>
            <p>Рискни лунами на рулетке</p>
            <a href="roulette.html" class="secret-btn">Играть</a>
        </div>
        <div class="secret-game-card">
            <h2>🎰 Слоты</h2>
            <p>Однорукий бандит на Mp</p>
            <a href="slots.html" class="secret-btn">Играть</a>
        </div>
        <div class="secret-game-card">
            <h2>🎲 Кости</h2>
            <p>Угадай сумму двух кубиков</p>
            <a href="dice.html" class="secret-btn">Играть</a>
        </div>
        <div class="secret-game-card">
            <h2>⬆️⬇️ Выше / Ниже</h2>
            <p>Предскажи следующее число</p>
            <a href="highlow.html" class="secret-btn">Играть</a>
        </div>
    </div>
    <a href="index.html" class="back-btn">↺ Вернуться в обычное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="mp.js"></script>
<script>
    window.addEventListener('mpUpdated', () => {
        if (typeof displayMp === 'function') displayMp();
    });
    setInterval(async () => {
        const mp = await getCurrentMp();
        const span = document.getElementById('mpValue');
        if (span && parseInt(span.innerText) !== mp) span.innerText = mp;
    }, 1000);
</script>
</body>
</html>
