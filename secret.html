<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🥷 Секретное меню</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #050508 !important;
        }
        .secret-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #aa66ff;
            text-align: center;
            margin-bottom: 30px;
        }
        /* Двухколоночная сетка */
        .two-columns {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .games-column {
            flex: 2;
            min-width: 260px;
        }
        .exchange-column {
            flex: 1;
            min-width: 260px;
        }
        /* Блок игр (как раньше) */
        .secret-game-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .secret-game-card {
            background: #111118;
            border-radius: 16px;
            padding: 20px;
            width: 200px;
            text-align: center;
            border: 1px solid #2a2a3a;
            transition: 0.2s;
        }
        .secret-game-card:hover {
            transform: translateY(-5px);
            background: #181824;
        }
        .secret-game-card h2 {
            color: #dd99ff;
        }
        .secret-game-card p {
            color: #aaa;
            font-size: 14px;
        }
        .secret-btn {
            background: #2a2a3a;
            color: #ffcc88;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 10px;
        }
        .secret-btn:hover {
            background: #3a3a4a;
        }
        /* Виджет обменника */
        .exchange-widget {
            background: #111118;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a2a3a;
            text-align: center;
        }
        .exchange-widget h3 {
            color: #ffcc88;
            margin-top: 0;
        }
        .balance-row {
            background: #1a1a24;
            padding: 8px;
            border-radius: 30px;
            margin: 15px 0;
            font-size: 1rem;
        }
        .balance-row span {
            color: #ffaa66;
            font-weight: bold;
        }
        .rate-info {
            background: #1a1a24;
            padding: 8px;
            border-radius: 30px;
            margin: 15px 0;
            font-size: 0.9rem;
            color: #aaa;
        }
        .exchange-input {
            width: 80%;
            padding: 8px;
            background: #1e1e2a;
            border: none;
            color: white;
            border-radius: 30px;
            text-align: center;
            font-size: 1rem;
            margin: 10px 0;
        }
        .exchange-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .exch-btn {
            background: linear-gradient(135deg, #4a2a6a, #2a1a4a);
            border: none;
            color: #ffcc88;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .exch-btn:hover {
            background: linear-gradient(135deg, #6a4a9a, #4a2a6a);
            transform: scale(1.02);
        }
        .exchange-message {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #ffaa66;
            background: #1a1a24;
            padding: 6px;
            border-radius: 20px;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            text-align: center;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
        @media (max-width: 700px) {
            .two-columns {
                flex-direction: column;
            }
            .exchange-column {
                order: -1; /* обменник сверху на мобильных */
            }
        }
    </style>
</head>
<body>
<div class="secret-container">
    <h1>🥷 Секретное меню</h1>
    <div class="two-columns">
        <!-- Левая колонка: игры -->
        <div class="games-column">
            <div class="secret-game-menu">
                <div class="secret-game-card">
                    <h2>🎡 Колесо удачи</h2>
                    <p>Рискни лунами на рулетке</p>
                    <a href="roulette.html" class="secret-btn">Играть</a>
                </div>
                <div class="secret-game-card">
                    <h2>🎰 Слоты</h2>
                    <p>Однорукий бандит на Mp</p>
                    <a href="slots.html" class="secret-btn">Играть</a>
                </div>
                <div class="secret-game-card">
                    <h2>🎲 Кости</h2>
                    <p>Угадай сумму двух кубиков</p>
                    <a href="dice.html" class="secret-btn">Играть</a>
                </div>
                <div class="secret-game-card">
                    <h2>⬆️⬇️ Выше / Ниже</h2>
                    <p>Предскажи следующее число</p>
                    <a href="highlow.html" class="secret-btn">Играть</a>
                </div>
            </div>
        </div>

        <!-- Правая колонка: обменник валют -->
        <div class="exchange-column">
            <div class="exchange-widget">
                <h3>🏦 Обменник валют</h3>
                <div class="balance-row">
                    🌙 Mp: <span id="exchangeMpValue">0</span> &nbsp;|&nbsp; ⭐ XP: <span id="exchangeXpValue">0</span>
                </div>
                <div class="rate-info">
                    Курс: 10 Mp ⇄ 1 XP
                </div>
                <input type="number" id="exchangeAmount" class="exchange-input" placeholder="Количество" min="1" value="10">
                <div class="exchange-buttons">
                    <button id="mpToXpBtn" class="exch-btn">🌙 → ⭐</button>
                    <button id="xpToMpBtn" class="exch-btn">⭐ → 🌙</button>
                </div>
                <div id="exchangeMessage" class="exchange-message"></div>
            </div>
        </div>
    </div>
    <div style="text-align: center;">
        <a href="index.html" class="back-btn">↺ Вернуться в обычное меню</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="mp.js"></script>
<script src="xp.js"></script>
<script>
    // Элементы обменника
    const exchangeAmount = document.getElementById('exchangeAmount');
    const mpToXpBtn = document.getElementById('mpToXpBtn');
    const xpToMpBtn = document.getElementById('xpToMpBtn');
    const exchangeMessage = document.getElementById('exchangeMessage');
    const exchangeMpSpan = document.getElementById('exchangeMpValue');
    const exchangeXpSpan = document.getElementById('exchangeXpValue');

    async function updateExchangeBalances() {
        const mp = await getCurrentMp();
        const xp = await getCurrentXP();
        exchangeMpSpan.innerText = mp;
        exchangeXpSpan.innerText = xp;
    }

    async function exchangeMpToXp() {
        let amount = parseInt(exchangeAmount.value);
        if (isNaN(amount) || amount < 1) {
            exchangeMessage.innerText = 'Введите положительное число';
            return;
        }
        const mp = await getCurrentMp();
        const neededMp = amount * 10;
        if (mp < neededMp) {
            exchangeMessage.innerText = `Не хватает Mp. Нужно ${neededMp} Mp, у вас ${mp}`;
            return;
        }
        await subtractMp(neededMp);
        await addXP(amount);
        await updateExchangeBalances();
        exchangeMessage.innerText = `Обменяно ${neededMp} Mp → ${amount} XP`;
        // также обновим отображение в верхней части (если есть)
        const topMpSpan = document.getElementById('mpValue');
        if (topMpSpan) topMpSpan.innerText = await getCurrentMp();
        // можно вызвать событие для обновления других частей
        window.dispatchEvent(new CustomEvent('mpUpdated'));
        window.dispatchEvent(new CustomEvent('xpUpdated'));
    }

    async function exchangeXpToMp() {
        let amount = parseInt(exchangeAmount.value);
        if (isNaN(amount) || amount < 1) {
            exchangeMessage.innerText = 'Введите положительное число';
            return;
        }
        const xp = await getCurrentXP();
        if (xp < amount) {
            exchangeMessage.innerText = `Не хватает XP. Нужно ${amount} XP, у вас ${xp}`;
            return;
        }
        await subtractXP(amount);
        await addMp(amount * 10);
        await updateExchangeBalances();
        exchangeMessage.innerText = `Обменяно ${amount} XP → ${amount * 10} Mp`;
        const topMpSpan = document.getElementById('mpValue');
        if (topMpSpan) topMpSpan.innerText = await getCurrentMp();
        window.dispatchEvent(new CustomEvent('mpUpdated'));
        window.dispatchEvent(new CustomEvent('xpUpdated'));
    }

    mpToXpBtn.addEventListener('click', exchangeMpToXp);
    xpToMpBtn.addEventListener('click', exchangeXpToMp);
    updateExchangeBalances();
    window.addEventListener('mpUpdated', updateExchangeBalances);
    window.addEventListener('xpUpdated', updateExchangeBalances);
</script>
</body>
</html>
