<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>⬆️ Выше/Ниже ⬇️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #050508; }
        .game-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }
        h1 { color: #aa66ff; }
        .mp-display { background: #111118; padding: 10px; border-radius: 40px; margin-bottom: 20px; color: #ffcc88; }
        .number-display {
            background: #1e1e2a;
            font-size: 48px;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
        }
        .bet-area { margin: 20px 0; }
        .bet-area input { background: #1e1e2a; border: none; color: white; padding: 10px; border-radius: 30px; width: 120px; }
        .buttons { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        button { background: #2a2a3a; border: none; color: white; font-size: 18px; padding: 10px 20px; border-radius: 40px; cursor: pointer; }
        .result { background: #111118; padding: 12px; border-radius: 30px; margin: 20px 0; }
        .back-btn { background: #2a2a3a; display: inline-block; margin-top: 20px; padding: 8px 16px; border-radius: 30px; text-decoration: none; color: #ccc; }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⬆️ Выше / Ниже ⬇️</h1>
    <div class="mp-display">🌙 Mp: <strong id="mpValue">0</strong></div>
    <div class="number-display" id="currentNumber">5</div>
    <div class="bet-area">
        <label>Ставка (Mp): </label>
        <input type="number" id="betAmount" min="1" value="10" step="1">
        <button id="maxBetBtn">Макс</button>
    </div>
    <div class="buttons">
        <button id="higherBtn">⬆️ Выше</button>
        <button id="lowerBtn">⬇️ Ниже</button>
        <button id="equalBtn">🟰 Равно (x5)</button>
    </div>
    <div id="resultMsg" class="result">⚡ Выберите направление</div>
    <a href="secret.html" class="back-btn">← Назад в секретное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="mp.js"></script>
<script src="highlow.js"></script>
</body>
</html>
