<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сапёр – игра на XP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .minesweeper-container {
            background: #2a2a3a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e1e2a;
            padding: 8px 15px;
            border-radius: 30px;
        }
        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 40px);
            grid-template-rows: repeat(8, 40px);
            justify-content: center;
            gap: 2px;
            background: #111;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .cell {
            width: 40px;
            height: 40px;
            background: #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            transition: 0.1s;
        }
        .cell.revealed {
            background: #ddd;
            cursor: default;
        }
        .cell.flagged::before {
            content: "🚩";
            font-size: 20px;
        }
        .cell.mine {
            background: #f66;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #1e1e2a;
            padding: 8px 15px;
            border-radius: 30px;
            color: white;
        }
        .restart-btn {
            background: #ffaa66;
        }
        .leaderboard {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="game-container minesweeper-container">
    <div class="game-header">
        <div class="user-info">
            <span id="currentUser"></span>
            <span>⭐ XP: <span id="xpValue">0</span></span>
            <button id="logoutBtn" style="display: none;">Выйти</button>
            <a href="index.html" class="back-link">← Меню</a>
        </div>
    </div>
    <div class="info-panel">
        <span>💣 Мин: <span id="mineCount">10</span></span>
        <span>⏱️ Время: <span id="timer">0</span> сек</span>
        <button id="newGameBtn" class="restart-btn">🔄 Новая игра</button>
    </div>
    <div id="board" class="board"></div>
    <div id="gameStatus" style="margin: 10px; font-weight: bold;"></div>
    <div class="leaderboard">
        <h3>🏆 Таблица лидеров (Сапёр)</h3>
        <div id="leaderboardList">Загрузка...</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="xp.js"></script>
<script>
    window.GAME_NAME = 'minesweeper';
</script>
<script src="leaderboard.js"></script>
<script src="minesweeper.js"></script>
</body>
</html>
