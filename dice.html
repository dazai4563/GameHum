<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎲 Кости (Dice)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #050508;
        }
        .game-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }
        h1 {
            color: #dd99ff;
        }
        .mp-display {
            background: #111118;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 20px;
            color: #ffcc88;
            font-size: 1.2rem;
        }
        .dice-area {
            margin: 20px 0;
        }
        .dice {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: #1e1e2a;
            border-radius: 16px;
            margin: 0 10px;
            font-size: 48px;
            line-height: 80px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            color: #ffaa66;
        }
        .bet-area {
            margin: 20px 0;
        }
        .bet-area input {
            background: #1e1e2a;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 30px;
            text-align: center;
            font-size: 18px;
            width: 150px;
        }
        .bet-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }
        .bet-option {
            background: #2a2a3a;
            border: none;
            color: #ffcc88;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .bet-option:hover, .bet-option.active {
            background: #6a4a9a;
            color: white;
        }
        .roll-btn {
            background: linear-gradient(135deg, #4a2a6a, #2a1a4a);
            border: none;
            color: white;
            font-size: 24px;
            padding: 12px 30px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            margin: 20px 0;
        }
        .roll-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #6a4a9a, #4a2a6a);
        }
        .result {
            background: #111118;
            padding: 12px;
            border-radius: 30px;
            margin: 20px 0;
            font-size: 18px;
            color: #ffaa66;
        }
        .payout-table {
            background: #111118;
            padding: 15px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
            text-align: left;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🎲 Кости (сумма двух костей)</h1>
    <div class="mp-display">
        🌙 Mp: <strong id="mpValue">0</strong>
    </div>
    <div class="dice-area">
        <div class="dice" id="dice1">⚀</div>
        <div class="dice" id="dice2">⚀</div>
    </div>
    <div class="bet-area">
        <label>Ставка (Mp): </label>
        <input type="number" id="betAmount" min="1" value="10" step="1">
        <button id="maxBetBtn" style="background:#2a2a3a; border:none; color:white; padding:8px 16px; border-radius:30px; margin-left:10px;">Макс</button>
    </div>
    <div class="bet-options">
        <button class="bet-option" data-bet="2">Ставка на 2 x6</button>
        <button class="bet-option" data-bet="3">Ставка на 3 x6</button>
        <button class="bet-option" data-bet="4">Ставка на 4 x5</button>
        <button class="bet-option" data-bet="5">Ставка на 5 x4</button>
        <button class="bet-option" data-bet="6">Ставка на 6 x3</button>
        <button class="bet-option" data-bet="7">Ставка на 7 x2</button>
        <button class="bet-option" data-bet="8">Ставка на 8 x3</button>
        <button class="bet-option" data-bet="9">Ставка на 9 x4</button>
        <button class="bet-option" data-bet="10">Ставка на 10 x5</button>
        <button class="bet-option" data-bet="11">Ставка на 11 x6</button>
        <button class="bet-option" data-bet="12">Ставка на 12 x6</button>
    </div>
    <button id="rollBtn" class="roll-btn">🎲 Бросить кости 🎲</button>
    <div id="resultMsg" class="result">Выберите ставку и бросьте кости</div>
    <div class="payout-table">
        <h4>💰 Выплаты (множители ставки):</h4>
        <p>2, 3, 11, 12 – x6 &nbsp;&nbsp;|&nbsp;&nbsp;4, 10 – x5 &nbsp;&nbsp;|&nbsp;&nbsp;5, 9 – x4 &nbsp;&nbsp;|&nbsp;&nbsp;6, 8 – x3 &nbsp;&nbsp;|&nbsp;&nbsp;7 – x2</p>
    </div>
    <a href="secret.html" class="back-btn">← Назад в секретное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="mp.js"></script>
<script src="dice.js"></script>
</body>
</html>
