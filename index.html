<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игровая платформа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🎮 Игровая платформа</h1>
    <div class="user-status">
        <span id="currentUser"></span>
        <span>⭐ XP: <span id="xpValue">0</span></span>
        <span id="authSection">
            <button id="changeNameBtn" style="display: none;">Сменить имя</button>
            <button id="showLinkBtn" style="display: none;">Привязать аккаунт</button>
            <button id="logoutBtn" style="display: none;">Выйти</button>
        </span>
    </div>
    <div class="game-menu">
        <div class="game-card">
            <h2>🐍 Змейка</h2>
            <p>Классическая игра. Управляй стрелками.</p>
            <a href="snake.html" class="btn">Играть</a>
        </div>
        <div class="game-card">
            <h2>✊ Камень, ножницы, бумага ✋</h2>
            <p>Игра против компьютера. Счёт до 3 побед.</p>
            <a href="rps.html" class="btn">Играть</a>
        </div>
        <div class="game-card">
            <h2>🃏 Блэкджек (21)</h2>
            <p>Игра на XP. Удвоение ставки при победе.</p>
            <a href="blackjack.html" class="btn">Играть</a>
        </div>
    </div>
</div>

<!-- Модальное окно для привязки аккаунта -->
<div id="linkModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2a2a3a; padding: 20px; border-radius: 16px; z-index: 1000; box-shadow: 0 0 20px black;">
    <h3>🔗 Привязать email и пароль</h3>
    <input type="text" id="linkUsername" placeholder="Имя пользователя" style="display: block; margin: 10px 0; padding: 8px; width: 100%;">
    <input type="email" id="linkEmail" placeholder="Email" style="display: block; margin: 10px 0; padding: 8px; width: 100%;">
    <input type="password" id="linkPassword" placeholder="Пароль" style="display: block; margin: 10px 0; padding: 8px; width: 100%;">
    <button id="linkAccountBtn">Привязать</button>
    <button id="closeModalBtn">Отмена</button>
    <div id="linkMessage" style="margin-top: 10px;"></div>
</div>

<!-- Модальное окно для смены имени -->
<div id="changeNameModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2a2a3a; padding: 20px; border-radius: 16px; z-index: 1001; box-shadow: 0 0 20px black;">
    <h3>✏️ Сменить имя</h3>
    <input type="text" id="newNameInput" placeholder="Новое имя" style="display: block; margin: 10px 0; padding: 8px; width: 100%;">
    <button id="confirmChangeNameBtn">Сохранить</button>
    <button id="closeChangeNameModalBtn">Отмена</button>
    <div id="changeNameMessage" style="margin-top: 10px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="xp.js"></script>
<script>
    // Привязка аккаунта
    async function linkAccount(email, password, username) {
        const supabase = window.supabaseClient;
        const { error: updateError } = await supabase.auth.updateUser({
            email: email,
            password: password,
            data: { username: username }
        });
        if (updateError) throw updateError;
        const { error: upsertError } = await supabase
            .from('users')
            .upsert({ id: window.currentUser.id, username: username });
        if (upsertError) console.warn('Не удалось обновить профиль:', upsertError);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const showLinkBtn = document.getElementById('showLinkBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const changeNameBtn = document.getElementById('changeNameBtn');
        const modal = document.getElementById('linkModal');
        const changeNameModal = document.getElementById('changeNameModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const closeChangeNameModalBtn = document.getElementById('closeChangeNameModalBtn');
        const linkBtn = document.getElementById('linkAccountBtn');
        const linkMessage = document.getElementById('linkMessage');
        const confirmChangeNameBtn = document.getElementById('confirmChangeNameBtn');
        const newNameInput = document.getElementById('newNameInput');
        const changeNameMessage = document.getElementById('changeNameMessage');

        function updateButtons() {
            if (window.currentUser && !window.currentUser.email) {
                showLinkBtn.style.display = 'inline-block';
                changeNameBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'inline-block';
            } else if (window.currentUser && window.currentUser.email) {
                showLinkBtn.style.display = 'none';
                changeNameBtn.style.display = 'inline-block'; // зарегистрированные тоже могут менять имя
                logoutBtn.style.display = 'inline-block';
            } else {
                showLinkBtn.style.display = 'none';
                changeNameBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        }

        showLinkBtn.onclick = () => { modal.style.display = 'block'; };
        closeModalBtn.onclick = () => { modal.style.display = 'none'; };
        logoutBtn.onclick = async () => {
            await logout();
            updateButtons();
        };
        linkBtn.onclick = async () => {
            const email = document.getElementById('linkEmail').value;
            const password = document.getElementById('linkPassword').value;
            const username = document.getElementById('linkUsername').value;
            try {
                await linkAccount(email, password, username);
                linkMessage.style.color = 'green';
                linkMessage.textContent = 'Аккаунт привязан! Теперь вы можете войти на другом устройстве.';
                setTimeout(() => { modal.style.display = 'none'; }, 2000);
                updateButtons();
            } catch (err) {
                linkMessage.style.color = 'red';
                linkMessage.textContent = err.message;
            }
        };

        // Смена имени
        changeNameBtn.onclick = () => {
            changeNameModal.style.display = 'block';
            newNameInput.value = window.currentUser?.user_metadata?.username || '';
            changeNameMessage.textContent = '';
        };
        closeChangeNameModalBtn.onclick = () => { changeNameModal.style.display = 'none'; };
        confirmChangeNameBtn.onclick = async () => {
            const newName = newNameInput.value.trim();
            if (!newName) {
                changeNameMessage.style.color = 'red';
                changeNameMessage.textContent = 'Имя не может быть пустым';
                return;
            }
            try {
                await changeUsername(newName);
                changeNameMessage.style.color = 'green';
                changeNameMessage.textContent = 'Имя успешно изменено!';
                setTimeout(() => { changeNameModal.style.display = 'none'; }, 1500);
                updateButtons();
            } catch (err) {
                changeNameMessage.style.color = 'red';
                changeNameMessage.textContent = err.message;
            }
        };

        setInterval(updateButtons, 1000);
        updateButtons();
    });
</script>
</body>
</html>
