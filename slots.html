<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎰 Слоты (однорукий бандит)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #050508;
        }
        .slots-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }
        h1 {
            color: #aa66ff;
        }
        .mp-display {
            background: #111118;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 20px;
            color: #ffcc88;
            font-size: 1.2rem;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .reel {
            background: #1a1a24;
            width: 100px;
            height: 100px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .bet-area {
            margin: 20px 0;
        }
        .bet-area input {
            background: #1e1e2a;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 30px;
            text-align: center;
            font-size: 18px;
            width: 150px;
        }
        .spin-btn {
            background: linear-gradient(135deg, #4a2a6a, #2a1a4a);
            border: none;
            color: white;
            font-size: 24px;
            padding: 12px 30px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            margin: 20px 0;
        }
        .spin-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #6a4a9a, #4a2a6a);
        }
        .result {
            background: #111118;
            padding: 12px;
            border-radius: 30px;
            margin: 20px 0;
            font-size: 18px;
        }
        .paytable {
            background: #111118;
            padding: 15px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
            text-align: left;
        }
        .paytable table {
            width: 100%;
            border-collapse: collapse;
        }
        .paytable td {
            padding: 5px;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
    </style>
</head>
<body>
<div class="slots-container">
    <h1>🎰 Однорукий бандит (слоты)</h1>
    <div class="mp-display">
        🌙 Mp: <strong id="mpValue">0</strong>
    </div>
    <div class="reels">
        <div class="reel" id="reel1">🍒</div>
        <div class="reel" id="reel2">🍒</div>
        <div class="reel" id="reel3">🍒</div>
    </div>
    <div class="bet-area">
        <label>Ставка (Mp): </label>
        <input type="number" id="betAmount" min="1" value="10" step="1">
        <button id="maxBetBtn" style="background:#2a2a3a; border:none; color:white; padding:8px 16px; border-radius:30px; margin-left:10px;">Макс</button>
    </div>
    <button id="spinBtn" class="spin-btn">🌀 КРУТИТЬ 🌀</button>
    <div id="resultMsg" class="result">Нажмите «Крутить»</div>
    <div class="paytable">
        <h4>🎁 Выплаты (множители ставки):</h4>
        <table>
            <tr><td>🍒 Вишня x3</td><td>x2</td></tr>
            <tr><td>🍋 Лимон x3</td><td>x3</td></tr>
            <tr><td>🍊 Апельсин x3</td><td>x4</td></tr>
            <tr><td>🍇 Слива x3</td><td>x5</td></tr>
            <tr><td>🔔 Колокольчик x3</td><td>x7</td></tr>
            <tr><td>7️⃣ Семёрка x3</td><td>x10</td></tr>
            <tr><td>❤️ Черви (2 любых) + любой</td><td>x2</td></tr>
            <tr style="background:#2a1a4a;"><td>💯💯💯 Три 💯</td><td>ДЖЕКПОТ x10!</td></tr>
        </table>
    </div>
    <a href="secret.html" class="back-btn">← Назад в секретное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="mp.js"></script>
<script src="slots.js"></script>
</body>
</html>
