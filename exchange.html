<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обменник Mp ↔ XP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #050508;
        }
        .exchange-container {
            background: #0a0a10;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }
        h1 {
            color: #dd99ff;
        }
        .balance {
            background: #111118;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .balance span {
            color: #ffcc88;
        }
        .rate {
            background: #1a1a24;
            padding: 8px;
            border-radius: 30px;
            margin: 15px 0;
            font-size: 0.9rem;
            color: #aaa;
        }
        .exchange-form {
            margin: 20px 0;
        }
        .exchange-form input {
            background: #1e1e2a;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 30px;
            text-align: center;
            font-size: 18px;
            width: 150px;
            margin: 0 10px;
        }
        .exchange-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        .btn-exchange {
            background: linear-gradient(135deg, #4a2a6a, #2a1a4a);
            border: none;
            color: #ffcc88;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-exchange:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #6a4a9a, #4a2a6a);
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 30px;
            background: #111118;
            color: #ffaa66;
        }
        .back-btn {
            background: #2a2a3a;
            color: #ccc;
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #3a3a4a;
        }
    </style>
</head>
<body>
<div class="exchange-container">
    <h1>🏦 Обменник валют</h1>
    <div class="balance">
        🌙 Mp: <span id="mpValue">0</span> &nbsp;|&nbsp; ⭐ XP: <span id="xpValue">0</span>
    </div>
    <div class="rate">
        Курс: <strong>10 Mp = 1 XP</strong> &nbsp;|&nbsp; <strong>1 XP = 10 Mp</strong>
    </div>
    <div class="exchange-form">
        <label>Количество: </label>
        <input type="number" id="amount" min="1" value="10" step="1">
    </div>
    <div class="exchange-buttons">
        <button id="mpToXpBtn" class="btn-exchange">🌙 → ⭐ (Mp в XP)</button>
        <button id="xpToMpBtn" class="btn-exchange">⭐ → 🌙 (XP в Mp)</button>
    </div>
    <div id="message" class="message"></div>
    <a href="secret.html" class="back-btn">← Назад в секретное меню</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="mp.js"></script>
<script src="xp.js"></script>
<script src="exchange.js"></script>
</body>
</html>
